name: Build and Publish PDFs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create tag if necessary
        id: version
        uses: fregante/daily-version-action@v2
        with:
          prefix: v

      # Compile in the official TeX Live image so CI matches a current local
      # install (Ubuntu's texlive-full lags years behind and paginates differently).
      # Each file is compiled twice to resolve hyperref/outline references.
      - name: Compile PDFs
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work -w /work texlive/texlive:latest sh -c '
            for f in cv_english cv_german; do
              for pass in 1 2; do
                xelatex -synctex=1 -interaction=nonstopmode "\\def\\version{${{ steps.version.outputs.version }}} \\input{$f.tex}" || exit 1;
              done;
            done'

      - name: Setup GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

      - name: Copy PDFs
        run: |
          mkdir -p output
          mv cv_english.pdf output/
          mv cv_german.pdf output/

      - name: Deploy PDFs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          publish_branch: gh-pages
